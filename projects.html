<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Описание 9 проектов ЮГУ</title>
  <link rel="stylesheet" href="styles.css?v=20260804-no-abbr-expansions">
</head>
<body>
  <div class="container">
    <header class="hero"><h1>Сравнительный анализ проектных инициатив ЮГУ (сессия ВШЭ)</h1><div class="hero-actions"><a class="hero-link" href="index.html">Вернуться к сравнительному анализу</a></div></header>
    <div class="block"><h3>Навигация по проектам</h3><div class="search-bar"><input class="search-input" id="search" type="search" placeholder="Поиск: докторантура, культура, управленческие практики, тьюторы, гранты…"><select class="filter-select" id="clusterFilter"><option value="all">Все 9 проектов</option><option value="science">Научная продуктивность</option><option value="trajectory">Кадровая траектория</option><option value="management">Управление</option><option value="culture">Развитие и культура</option></select></div></div>
    <div class="project-list" id="projectList"></div>
  </div>
  <button class="back-top" id="backTop" aria-label="Наверх">↑</button>
  <script src="data.js"></script>
  <script>
    const D=window.YUGU_DATA, P=D.projects;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pById=id=>P.find(p=>p.id===id);
    function expandTerms(value) {
      return String(value ?? '');
    }

    const fmt = value => esc(expandTerms(value));

    const clusterMap={science:new Set(['p1']),trajectory:new Set(['p2','p4','p7','p10']),management:new Set(['p3','p6']),culture:new Set(['p3','p5','p8'])};
    const lis=a=>`<ul>${(a||[]).map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
    const contextualLis=(a,prefix)=>`<ul>${(a||[]).map(x=>`<li>${fmt(prefix)} ${fmt(String(x).replace(/[.!?]+$/,''))}.</li>`).join('')}</ul>`;
    const sphereFor=(field,tag)=>D.tagSpheres?.[field]?.[tag]||'process';
    const tags=(o,field)=>`<div class="tag-line">${Object.keys(o||{}).map(tag=>{
      const relation = field === 'resultTags' ? (D.resultAnalysis||[]).find(item=>item.title===tag) : null;
      const category = relation ? ` relation-${relation.category}` : '';
      return `<span class="tiny-tag sphere-${sphereFor(field,tag)}${category}">${fmt(tag)}</span>`;
    }).join('')}</div>`;
    const legend=()=>Object.entries(D.directions).map(([k,v])=>`<span><i class="legend-dot sphere-${k}"></i>${fmt(v)}</span>`).join('');

    function solutionStageBlock(stages){
      if(!stages?.length) return '';
      return `<div class="solution-stages"><b>Этапы реализации</b>${stages.map(s=>`
        <div class="solution-stage">
          ${s.time ? `<span>${fmt(s.time)}</span>` : ''}
          <strong>${fmt(s.name)}</strong>
          ${s.text ? `<p>${fmt(s.text)}</p>` : ''}
          ${s.actions?.length ? `<ul class="solution-actions">${s.actions.map(a=>`<li>${fmt(a)}</li>`).join('')}</ul>` : ''}
        </div>`).join('')}</div>`;
    }

    function solutionTagBlock(p){return Object.entries(p.solutionTags||{}).map(([tag,detail])=>`<div class="project-solution-group"><span class="tiny-tag sphere-${sphereFor('solutionTags',tag)}">${fmt(tag)}</span><div class="project-solution-items">${(detail.solutions||[]).map(s=>`<div class="project-solution-item"><b>${fmt(s.name)}</b></div>`).join('')}</div></div>`).join('')}

    function projectCard(p){const rel=(p.related||[]).map(pById).filter(Boolean); return `<article class="project-card" id="${p.id}" data-id="${p.id}">
      <button class="project-head" aria-expanded="false"><span class="project-num">${p.num}</span><span class="project-title-wrap"><span class="project-title">${fmt(p.title)}</span><span class="project-meta">${fmt(p.period)}</span></span><span class="chev">⌄</span></button>
      <div class="project-body"><div class="summary-strip">${fmt(p.annotation || p.overview)}</div>${p.sourceCaveat?`<div class="source-caveat"><strong>Уточнение по исходному материалу.</strong> ${fmt(p.sourceCaveat)}</div>`:''}
      <section class="detail-section"><h4>1. Выявленная проблема / вызов</h4><p>${fmt(p.problemSummary)}</p></section>
      <div class="block project-solutions-block"><h3>2. Самостоятельные проектные единицы</h3><p class="section-note">${fmt(p.solutionStructure)}.</p><div class="solutions">${(p.solutions||[]).map((s,i)=>`<article class="solution-card"><div class="s-top"><span class="solution-index">${fmt(s.unitType || `Единица ${i+1}`)}</span><h5>${fmt(s.name)}</h5></div><div class="solution-period"><b>Срок:</b> ${fmt(s.time)}</div><div class="autonomy-box"><b>Почему выделено именно так</b><p>${fmt(s.autonomyBasis)}</p></div><div class="solution-field"><b>Содержание</b><p>${fmt(s.content)}</p></div>${solutionStageBlock(s.stages)}${s.actions?.length?`<div class="solution-field"><b>Основные действия</b><ul class="solution-actions">${s.actions.map(a=>`<li>${fmt(a)}</li>`).join('')}</ul></div>`:''}${s.resources?.length?`<div class="solution-field"><b>Ресурсы</b><div class="solution-resource-list">${lis(s.resources)}</div></div>`:''}<div class="solution-metric"><b>Количественный результат</b><br>${fmt('Проект предусматривает следующий измеримый результат: ' + String(s.metrics).replace(/[.!?]+$/,'') + '.')}</div></article>`).join('')}</div></div>
      <div class="detail-grid"><section class="detail-section"><h4>3. Необходимые ресурсы проекта</h4><div class="project-resource-list">${lis(p.resources)}</div></section><section class="detail-section"><h4>4. Ожидаемые результаты проекта</h4><p>${fmt(p.resultQuality)}</p><div class="result-quant"><b>Количественные показатели</b>${lis(p.resultQuant)}</div></section></div>
      <div class="detail-grid"><section class="detail-section"><h4>Сроки / дорожная карта проекта</h4><div class="timeline">${(p.roadmap||[]).map(r=>`<div class="road-step"><div class="road-time">${fmt(r.time)}</div><div class="road-title">${fmt(r.title)}</div><div class="road-text">${fmt(r.text)}</div></div>`).join('')}</div></section><section class="detail-section"><h4>Риски, указанные в проекте</h4><p><b>Риски отказа / отсутствия решения</b></p>${p.risksRefusal?.length?lis(p.risksRefusal):'<p class="section-note">Отдельный блок не выделен.</p>'}<p style="margin-top:9px"><b>Риски реализации</b></p>${p.risksImplementation?.length?lis(p.risksImplementation):'<p class="section-note">Отдельный блок не выделен.</p>'}</section></div>
      <div class="analysis-box project-tags-box"><h4>Место проекта в сравнительной аналитике</h4><div class="project-tag-section"><b>Проблемы, прямо подтверждённые исходным проектом</b>${tags(p.problemTags,'problemTags')}</div><div class="project-tag-section"><b>Направления, в которые включены самостоятельные проектные единицы</b>${tags(p.solutionTags,'solutionTags')}<div class="project-solution-map">${solutionTagBlock(p)}</div></div><div class="project-tag-section"><b>Необходимые ресурсы</b>${tags(p.resourceTags,'resourceTags')}</div><div class="project-tag-section"><b>Связи количественных результатов</b>${tags(p.resultTags,'resultTags')}<div class="project-result-legend"><span><i class="relation-legend-dot relation-closure"></i>Закрытие показателя</span><span><i class="relation-legend-dot relation-complement"></i>Дополняющие показатели</span><span><i class="relation-legend-dot relation-unique"></i>Уникальный результат</span></div></div><div class="legend-row sphere-legend">${legend()}</div></div>
      <div class="detail-section analysis-box" style="margin-top:12px"><h4>Смежные проекты</h4><div class="relation-links">${rel.length?rel.map(x=>`<a href="#${x.id}" data-jump="${x.id}">${x.num}. ${fmt(x.short)}</a>`).join(''):'<span style="font-size:.8rem;color:var(--muted)">Выраженных смежных проектов нет</span>'}</div></div>
      </div></article>`}

    function render(){const q=document.getElementById('search').value.trim().toLowerCase(), f=document.getElementById('clusterFilter').value;const visible=P.filter(p=>{if(f!=='all'&&!clusterMap[f]?.has(p.id))return false;const hay=[p.title,p.short,p.annotation,p.overview,p.problemSummary,p.resultQuality,...Object.keys(p.problemTags||{}),...Object.keys(p.solutionTags||{}),...Object.keys(p.resultTags||{}),...Object.keys(p.resourceTags||{}),...(p.resources||[]),...(p.resultQuant||[]),...(p.solutions||[]).flatMap(s=>[s.name,s.content,s.metrics,...(s.actions||[]),...(s.stages||[]).flatMap(x=>[x.name,x.text])])].join(' ').toLowerCase();return !q||hay.includes(q)});document.getElementById('projectList').innerHTML=visible.map(projectCard).join('')||'<div class="block"><h3>Ничего не найдено</h3></div>';bindCards();openHash(false)}
    function bindCards(){document.querySelectorAll('.project-head').forEach(btn=>btn.addEventListener('click',()=>{const c=btn.closest('.project-card'),will=!c.classList.contains('open');c.classList.toggle('open',will);btn.setAttribute('aria-expanded',will?'true':'false')}));document.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',()=>setTimeout(()=>openHash(true),0)))}
    function openHash(scroll){const id=location.hash.replace('#','');if(!id)return;const card=document.getElementById(id);if(!card)return;card.classList.add('open');card.querySelector('.project-head')?.setAttribute('aria-expanded','true');if(scroll)setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'start'}),60)}
    document.getElementById('search').addEventListener('input',render);document.getElementById('clusterFilter').addEventListener('change',render);window.addEventListener('hashchange',()=>openHash(true));const bt=document.getElementById('backTop');window.addEventListener('scroll',()=>bt.style.display=window.scrollY>600?'block':'none');bt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});render();openHash(true);
  </script>
</body>
</html>
